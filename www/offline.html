<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Offline - KanoPlay</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  min-height: 100vh;
  margin: 0;
  padding: 0;
}
body {
  display: block; 
  overflow-y: auto;       
  overflow-x: hidden;
  text-align: center;
  padding: 24px; 
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(circle at 50% 0%, rgba(120, 200, 120, .08), transparent 50%),
    radial-gradient(circle at 0% 100%, rgba(255, 255, 255, .03), transparent 45%),
    #000;
}
.wrap {
  max-width: 360px;
  width: 100%;
  margin: 0 auto;
  opacity: 1 !important; 
  visibility: visible !important; 
}
.img-wrap {
  position: relative;
  margin: 0 auto 20px auto;
  width: 100%;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .08);
  border: 2px solid rgba(120, 200, 120, .2);
  z-index: 1;
}
.img-wrap img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 18px; 
}
.img-wrap::after {
  content: '';
  position: absolute;
  inset: -20px;
  background: radial-gradient(circle, rgba(120, 200, 120, .15), transparent 70%);
  z-index: -1;
  border-radius: 50%;
  animation: pulse 3s ease-in-out infinite;
  pointer-events: none; 
}
@keyframes pulse {
  0%, 100% { opacity: .4; }
  50% { opacity: .8; }
}
h1 {
  font-size: 26px;
  font-weight: 900;
  margin-bottom: 10px;
  letter-spacing: -.5px;
  color: #fff;
  opacity: 1 !important;
  visibility: visible !important;
}
p {
  font-size: 13px;
  color: #a0a0a0;
  line-height: 1.7;
  margin-bottom: 26px;
  padding: 0 10px;
  opacity: 1 !important;
  visibility: visible !important;
}
button {
  width: 100%;
  padding: 16px 24px;
  border-radius: 14px;
  background: #fff;
  color: #000;
  border: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  letter-spacing: .3px;
  transition: transform .2s ease, background .2s ease;
  box-shadow: 0 8px 24px rgba(255, 255, 255, .15);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  opacity: 1 !important;
  visibility: visible !important;
}
button:hover {
  transform: translateY(-2px);
  background: #e8e8e8;
}
button:active {
  transform: translateY(0) scale(.97);
}
button svg {
  width: 18px;
  height: 18px;
}
.status {
  margin-top: 20px;
  font-size: 10.5px;
  color: #6a6a6a;
  font-weight: 600;
  letter-spacing: .5px;
  text-transform: uppercase;
  opacity: 1 !important;
  visibility: visible !important;
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="img-wrap">
      <img src="arisu.png" alt="Arisu Offline">
    </div>
    <h1>Kamu Offline!!</h1>
    <p>Arisu bilang:<br>"Cek koneksi internet kamu dulu ya, biar bisa akses KanoPlay!"</p>
    <button onclick="window.location.href='https://kano-streaming.pages.dev/'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      Coba Lagi
    </button>
    <div class="status">KanoPlay © 2026</div>
  </div>

  <script>
    // Fallback pengaman ganda untuk WebView
    setTimeout(function() {
      var wrap = document.querySelector('.wrap');
      if (wrap) {
        wrap.style.opacity = '1';
        wrap.style.visibility = 'visible';
        wrap.style.display = 'block';
      }
    }, 500);
  </script>
</body>
</html>
